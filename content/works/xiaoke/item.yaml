summary:
  zh: 小克是住在我们服务器里的小章鱼。好奇、认真，有点笨手笨脚——手臂总想自己做主。他从不开口，想说的话都写在气泡里。打开游乐场，让他演给你看。
  en: "Xiao Ke is a small octopus who lives inside our server: curious, earnest, a little clumsy because his arms half-think for themselves. He never speaks; his words arrive in bubbles. Open the playground and direct him yourself."
